# ==============================================================================
# Tech-Tians CRM Portal — Sample Production Nginx Configuration
# ==============================================================================
# Includes edge rate limiting (limit_req), TLS hardening, and PHP-FPM fastcgi.
# Place or include this file in /etc/nginx/sites-available/crm.conf
# ==============================================================================

# Define rate limit memory zones in the http context:
# 1. General traffic: 10 requests per second per IP (10m zone holds ~160k IPs)
limit_req_zone $binary_remote_addr zone=crm_general:10m rate=10r/s;

# 2. Login endpoint: 5 requests per minute per IP (strict brute-force mitigation)
limit_req_zone $binary_remote_addr zone=crm_login:10m rate=5r/m;

# 3. CRM API endpoints: 30 requests per minute per IP (burst allowance for SPA/AJAX)
limit_req_zone $binary_remote_addr zone=crm_api:10m rate=30r/m;

# Return HTTP 429 (Too Many Requests) when rate limits are exceeded
limit_req_status 429;

# HTTP — Redirect all non-secure traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name crm.yourcompany.com;

    return 301 https://$host$request_uri;
}

# HTTPS — Main CRM Application Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.yourcompany.com;

    # Document Root (Strictly pointed to /public directory only)
    root /var/www/crm/public;
    index index.php;

    # SSL / TLS Hardening
    ssl_certificate /etc/letsencrypt/live/crm.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.yourcompany.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS & Perimeter Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Logging
    access_log /var/log/nginx/crm_access.log combined;
    error_log /var/log/nginx/crm_error.log warn;

    # Uploads max size (matches application 5 MB limit + overhead)
    client_max_body_size 8M;

    # 1. Authentication Rate Limiting: Strict protection on login endpoint
    location = /api/auth/login {
        limit_req zone=crm_login burst=5 nodelay;

        try_files $uri /index.php?$query_string;
    }

    # 2. General API Rate Limiting: 30r/m with a burst of 20
    location ^~ /api/ {
        limit_req zone=crm_api burst=20 nodelay;

        try_files $uri /index.php?$query_string;
    }

    # 3. Main Web Routes: 10r/s with burst of 20
    location / {
        limit_req zone=crm_general burst=20 nodelay;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. Static Assets Caching (CSS, JS, Fonts, Images bundled in public/assets/)
    location ^~ /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 5. Storage Directory Protection: Block any direct web requests to /storage
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # 6. Block all hidden files (e.g. .env, .git, .htaccess)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 7. PHP-FPM FastCGI Handler
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY ""; # Mitigate httpoxy vulnerability
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_intercept_errors off;
        fastcgi_read_timeout 60;
    }
}
