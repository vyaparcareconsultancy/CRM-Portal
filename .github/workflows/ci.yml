name: Continuous Integration (CI)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Lint, Static Analysis, Unit & E2E Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crm_test_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, openssl, gd, bcmath, zip, curl
          coverage: none

      - name: Setup Node.js (for Playwright E2E)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock', '**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Syntax Linting (php -l)
        run: |
          echo "Linting all PHP files..."
          find app config public database tests cron -type f -name "*.php" -print0 | xargs -0 -n1 -P4 php -l

      - name: Run PHPStan Static Analysis (Level 6)
        run: vendor/bin/phpstan analyse -c phpstan.neon

      - name: Configure Test Environment
        run: |
          cp .env.testing .env
          echo "Waiting for MySQL container..."
          until mysqladmin ping -h"127.0.0.1" -P3306 -uroot -proot --silent; do
            sleep 1
          done
          echo "MySQL is ready. Running database migrations..."
          php database/migrate.php

      - name: Run PHPUnit Test Suite
        run: vendor/bin/phpunit --testdox

      - name: Run Component Verification Scripts
        run: php tests/run_tests.php

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Start PHP Web Server
        run: |
          php -S 127.0.0.1:8000 -t public &
          echo "Waiting for local web server..."
          sleep 2
          curl -I http://127.0.0.1:8000/health

      - name: Run Playwright E2E Tests (Headless)
        env:
          APP_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
